name: Benchmark

# Builds main (or another base) and this branch on the same machine and measures both (scripts/benchmark.sh):
# launch time, memory, CPU and download size. The table appears on the run's summary page.
on:
  pull_request:
  push:
    branches: ["perf-exp-*"]   # experiments, measured without a pull request
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per build (the table shows medians)
        default: "3"

permissions:
  contents: read

# A newer push replaces a measurement still running for the same branch.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # The Shelf measurements use a test Shelf (a switch published builds don't have).
      PANCAKENOTCH_INTERNAL_TESTING: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Both builds get an update key, so Sparkle runs as in a real release. A random key: nothing is
      # signed or published.
      - name: Update key
        run: echo "SPARKLE_PUBLIC_ED_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Build this branch
        run: ./scripts/build-app.sh release && mv build/PancakeNotch.app "$RUNNER_TEMP/branch.app"
      # An experiment can compare against another branch and take more runs: a `.benchmark-base`
      # file holding "<branch, tag or commit> [runs]".
      - name: Build the comparison
        env:
          INPUT_RUNS: ${{ inputs.runs }}
        run: |
          read -r BASE RUNS < .benchmark-base 2>/dev/null || true
          echo "BASE=${BASE:-main}" >> "$GITHUB_ENV"
          echo "RUNS=${RUNS:-$INPUT_RUNS}" >> "$GITHUB_ENV"
          COMPARISON="${BASE:-main}"
          if git show-ref --verify --quiet "refs/remotes/origin/$COMPARISON"; then
            COMPARISON="refs/remotes/origin/$COMPARISON"
          fi
          git worktree add "$RUNNER_TEMP/base" "$COMPARISON"
          cd "$RUNNER_TEMP/base" && ./scripts/build-app.sh release && mv build/PancakeNotch.app "$RUNNER_TEMP/base.app"
      - name: Measure
        shell: bash   # adds pipefail: a failed benchmark fails the step instead of passing through tee
        run: |
          ./scripts/benchmark.sh "${RUNS:-3}" "$BASE=$RUNNER_TEMP/base.app" branch="$RUNNER_TEMP/branch.app" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Where this branch's idle memory goes
        run: ./scripts/diagnose-memory.sh "$RUNNER_TEMP/branch.app" 30
