name: Benchmark

# Builds this branch and an earlier build on the same machine and measures both (scripts/benchmark.sh):
# launch time, memory, CPU and download size. The table appears on the run's summary page.
#
# It holds a Mac for about 25 minutes, so it runs only before a release, not on every pull request:
#   - on the release pull request (a branch named release/vX.Y.Z), against the last release;
#   - by hand (Actions › Benchmark › Run workflow), against the last release or the base you name;
#   - on perf-exp-* branches (experiments, measured without a pull request), against main.
on:
  pull_request:
  push:
    branches: ["perf-exp-*"]
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per build (the table shows medians)
        default: "3"
      base:
        description: Compare with this branch, tag or commit (empty = the last release)
        default: ""

permissions:
  contents: read

# A newer push replaces a measurement still running for the same branch.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    # Other pull requests get a skipped run (no Mac). Benchmark isn't a required check.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # The Shelf measurements use a test Shelf (a switch published builds don't have).
      PANCAKENOTCH_INTERNAL_TESTING: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Both builds get an update key, so Sparkle runs as in a real release. A random key: nothing is
      # signed or published.
      - name: Update key
        run: echo "SPARKLE_PUBLIC_ED_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Build this branch
        run: ./scripts/build-app.sh release && mv build/PancakeNotch.app "$RUNNER_TEMP/branch.app"
      # An experiment can compare against another branch and take more runs: a `.benchmark-base`
      # file holding "<branch, tag or commit> [runs]". Without one, experiments compare with main and
      # everything else with the last release (the newest vX.Y.Z tag), which is what a release changes.
      - name: Build the comparison
        env:
          INPUT_RUNS: ${{ inputs.runs }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          read -r BASE RUNS < .benchmark-base 2>/dev/null || true
          BASE="${INPUT_BASE:-$BASE}"
          if [[ -z "$BASE" && "$GITHUB_REF_NAME" == perf-exp-* ]]; then
            BASE=main
          fi
          BASE="${BASE:-$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)}"
          BASE="${BASE:-main}"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "RUNS=${RUNS:-$INPUT_RUNS}" >> "$GITHUB_ENV"
          COMPARISON="$BASE"
          if git show-ref --verify --quiet "refs/remotes/origin/$COMPARISON"; then
            COMPARISON="refs/remotes/origin/$COMPARISON"
          fi
          git worktree add "$RUNNER_TEMP/base" "$COMPARISON"
          cd "$RUNNER_TEMP/base" && ./scripts/build-app.sh release && mv build/PancakeNotch.app "$RUNNER_TEMP/base.app"
      - name: Measure
        shell: bash   # adds pipefail: a failed benchmark fails the step instead of passing through tee
        run: |
          ./scripts/benchmark.sh "${RUNS:-3}" "$BASE=$RUNNER_TEMP/base.app" branch="$RUNNER_TEMP/branch.app" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Where this branch's idle memory goes
        run: ./scripts/diagnose-memory.sh "$RUNNER_TEMP/branch.app" 30
