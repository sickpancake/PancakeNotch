name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Test
        run: ./scripts/swift.sh test
      - name: Build app bundle
        run: ./scripts/build-app.sh release
      - name: Idle memory budget (ADR-0006)
        run: ./scripts/check-memory.sh build/PancakeNotch.app 30 50
